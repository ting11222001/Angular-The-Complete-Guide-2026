<app-places-container title="Your Favorite Places">
  @if (isLoading() && !error()) {
    <p class="fallback-text">Loading your favorite places...</p>
  }

  @if (error()) {
    <p class="fallback-text">Error: {{ error() }}</p>
  }

  @if (places() && places()!.length > 0) {
    <app-places [places]="places()!" />
  } @else {
    <p class="fallback-text">Unfortunately, no favorite places are found.</p>
  }
</app-places-container>
